  /v3/orders/statistics:
    get:
      tags:
        - Orders
      operationId: getOrderStatistics
      summary: Get order statistics
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          $ref: "#/components/responses/GetOrderStatisticsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
      description:
        "Requires the `order:statistics:list` scope. Retrieves descriptive
        statistics about orders, such as total orders, total revenue, and other
        aggregated data. Can be filtered using the same parameters as the orders
        list endpoint."
      parameters:
        - description: Type of datetime for statistics (defaults to 'created_at')
          in: query
          name: datetime_type
          required: false
          schema:
            default: created_at
            enum:
              - draft_time
              - pending_time
              - confirmed_time
              - in_process_time
              - ready_time
              - canceled_time
              - shipped_time
              - shipped_rts_time
              - completed_time
              - rts_time
              - closed_time
            type: string
        - description: Timezone for datetime adjustment (defaults to 'Asia/Jakarta')
          in: query
          name: tz
          required: false
          schema:
            default: Asia/Jakarta
            type: string
        - description: Date breakdown for statistics (defaults to 'off')
          in: query
          name: breakdown_date
          required: false
          schema:
            default: off
            enum:
              - off
              - day
              - week
              - month
            type: string
        - description: Include breakdown by order status (defaults to 'false')
          in: query
          name: is_breakdown_status
          required: false
          schema:
            default: "false"
            enum:
              - "true"
              - "false"
            type: string
        - description: Custom breakdown key for statistics (defaults to 'off')
          in: query
          name: custom_breakdown_key
          required: false
          schema:
            default: off
            enum:
              - off
              - handler_id
              - advertiser_id
              - page_id
              - city
              - province
            type: string
        - description: Minimum number of days for statistics (defaults to 0)
          in: query
          name: minimum_days
          required: false
          schema:
            default: 0
            type: integer
        - description:
            Search term for the selected `search_field`. Defaults to order ID
            search when `search_field` is omitted or unsupported.
          in: query
          name: search
          required: false
          schema:
            type: string
        - description:
            Field used by `search`. Defaults to `order_id` when omitted or
            unsupported.
          in: query
          name: search_field
          required: false
          schema:
            default: order_id
            enum:
              - order_id
              - shipment_receipt
              - external_id
              - pg_reference_id
              - gross_revenue
              - customer_name
              - customer_email
              - customer_phone
            type: string
        - description: Filter by order status
          in: query
          name: status
          required: false
          schema:
            type: string
        - description: Filter by payment status
          in: query
          name: payment_status
          required: false
          schema:
            type: string
        - description: Filter by business ID
          in: query
          name: business_id
          required: false
          schema:

      operationId: sendWabaTypingIndicator
      summary: Send a WABA typing indicator
      description:
        "Requires the `waba_account:operate` scope. Sends Meta's typing
        indicator for an existing inbound message, which also marks that message
        as read."
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/WabaSendMode"
      responses:
        "200":
          description: Typing indicator accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - wamid
                  - status
                  - typing_indicator
                properties:
                  success:
                    type: boolean
                    example: true
                  wamid:
                    type: string
                    example: wamid.HBgLMTY1MDM4Nzk0MzkVAgARGBJDQjZCMzlEQUE4OTJBMTE4RTUA
                  status:
                    type: string
                    enum:
                      - read
                  typing_indicator:
                    type: object
                    required:
                      - type
                    properties:
                      type:
                        type: string
                        enum:

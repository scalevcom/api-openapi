        "403":
          $ref: "#/components/responses/ForbiddenResponse"
      description:
        "Requires the `order:list` scope. Retrieves a paginated list of
        orders with optional filtering. The data is sorted by created_at in
        descending order and cannot be changed. Uses cursor-based pagination
        with default page size of 25 and maximum of 25."
      parameters:
        - description: "Number of items per page (default: 25, max: 25)"
          in: query
          name: page_size
          required: false
          schema:
            example: 25
            maximum: 25
            type: integer
        - description: Opaque cursor for the next page.
          in: query
          name: next_cursor
          required: false
          schema:
            type: string
        - description: Opaque cursor for the previous page.
          in: query
          name: previous_cursor
          required: false
          schema:
            type: string
        - description:
            Search term for the selected `search_field`. Defaults to order ID
            search when `search_field` is omitted or unsupported.
          in: query
          name: search
          required: false
          schema:
            type: string
        - description:
            Field used by `search`. Defaults to `order_id` when omitted or
            unsupported.
          in: query
          name: search_field
          required: false
          schema:
            default: order_id
            enum:
              - order_id
              - shipment_receipt
              - external_id
              - pg_reference_id
              - gross_revenue
              - customer_name
              - customer_email
              - customer_phone
            type: string
        - description: Filter spam orders
          in: query
          name: is_probably_spam
          required: false

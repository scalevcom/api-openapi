            Payment gateway payload. Manual methods such as `bank_transfer` and
            `cod` can return an empty object while the public order contains
            the buyer-facing instructions to render. Virtual account methods
            expose provider reference and account details under the provider's
            `payment_method` object. QRIS responses expose QR data or a QR image
            payload. E-wallet, card, and invoice methods may expose provider
            actions or hosted provider URLs. Storefronts should render their
            own payment page from these fields and use `payment_url` only as a
            hosted fallback.
        public_order_url:
          type: string
          format: uri
          nullable: true
          description: Buyer-facing public order status URL.
        payment_url:
          type: string
          format: uri
          nullable: true
          description: Buyer-facing payment or instruction URL. Redirect or open this URL for hosted payment methods.
        payment_method:
          type: string
          example: bank_transfer
        sub_payment_method:
          type: string
          nullable: true
          description: Provider channel such as a virtual-account bank code when applicable.
      additionalProperties: true

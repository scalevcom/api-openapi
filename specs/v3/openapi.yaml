  schemas:
    FlexibleObject:
      type: object
      additionalProperties: true
    FlexibleValue:
      oneOf:
        - $ref: "#/components/schemas/FlexibleObject"
        - type: array
          items: {}
        - type: string
        - type: number
        - type: boolean
    AuthenticatedBusinessIdentity:
      type: object
      additionalProperties: false
      required:
        - auth_method
        - business
        - scopes
      properties:
        auth_method:
          type: string
          nullable: true
          enum:
            - oauth
            - api_key
            - app_login
        business:
          $ref: "#/components/schemas/AuthenticatedBusinessSummary"
        user:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            id:
              type: integer
            email:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            fullname:
              type: string
              nullable: true
            avatar:
              type: string
              nullable: true
        oauth_application:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            id:
              type: integer
            client_id:
              type: string
            name:
              type: string
              nullable: true
            homepage_url:
              type: string
              nullable: true
        authorized_business:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            id:
              type: integer
            authorized_business_id:
              type: integer
            authorized_by:
              type: object
              nullable: true
              additionalProperties: true
            is_active:
              type: boolean
            is_enabled:
              type: boolean
            scopes:
              type: array
              items:
                type: string
            inserted_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        scopes:
          type: array
          nullable: true
          items:
            type: string
    AuthenticatedBusinessSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        is_banned:
          type: boolean
        unique_id:
          type: string
          nullable: true
        account_holder:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        contact_email:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        is_manual_reseller_transfer_allowed:
          type: boolean
    HtmlModeCspPolicy:
      type: object
      additionalProperties: false
      properties:
        connect_src:
          type: array
          items:
            type: string
        img_src:
          type: array
          items:
            type: string
        script_src:
          type: array
          items:
            type: string
        style_src:
          type: array
          items:
            type: string
        frame_src:
          type: array
          items:
            type: string
      description: Supported HTML Mode CSP keys. Unsupported keys are rejected.
    LandingPageCreateRequest:
      type: object
      required:
        - name
        - slug
        - page_display
      additionalProperties: false
      properties:
        name:
          type: string
          example: API HTML Page
        slug:
          type: string
          example: api-html-page
        is_published:
          type: boolean
          description: When true, publishes the created page display.
        store_id:
          type: integer
          nullable: true
          description:
            Optional top-level store association. HTML Checkout store context is
            configured through `page_display.form_display.store_id`.
        page_display:
          $ref: "#/components/schemas/LandingPageDisplayRequest"
    LandingPageUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        slug:
          type: string
        is_published:
          type: boolean
          description: >
            Set true to publish `current_page_display_id`; set false with
            `current_page_display_id: null` to unpublish the page.

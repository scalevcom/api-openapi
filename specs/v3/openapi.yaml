          type: boolean
        is_disable_custom_font:
          type: boolean
        is_disable_client_tagging:
          type: boolean
        client_analytics_config:
          type: string
          nullable: true
          enum:
            - head
            - body_close_delay
            - web_worker
    LandingPageDisplayRequest:
      type: object
      required:
        - render_mode
        - meta
        - onload_fb_events
        - onload_tiktok_events
        - onload_kwai_client_events
        - onload_kwai_server_events
        - fb_events_onload_parameters
        - tiktok_events_onload_parameters
        - kwai_client_events_onload_parameters
        - kwai_server_events_onload_parameters
      additionalProperties: true
      properties:
        render_mode:
          type: string
          enum:
            - html_mode
            - builder
          description:
            HTML Mode requests use `html_mode`. Builder payload details are
            intentionally not documented here and remain unsupported for public
            integration guidance; use HTML Mode for API-created pages.
        html_code:
          type: string
          description: Body-only HTML for HTML Mode.
          maxLength: 204800
        css_code:
          type: string
          maxLength: 102400
        js_code:
          type: string
          maxLength: 102400
        csp_policy:
          $ref: "#/components/schemas/HtmlModeCspPolicy"
        meta:
          type: object
          additionalProperties: true
        form_display:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LandingPageFormDisplayRequest"
          description:
            HTML Checkout configuration. Omit or send null for HTML Sales pages.
        fb_pixel_ids:
          type: array
          description: >
            Scalev record IDs for Meta/Facebook pixels to attach to this page
            display. These are the numeric Scalev pixel records, not the
            provider pixel code. Send an empty array for no Meta/Facebook
            pixels.
          items:
            type: integer
        tiktok_pixel_ids:
          type: array
          description: >
            Scalev record IDs for TikTok pixels to attach to this page display.
            These are the numeric Scalev pixel records, not the provider pixel
            code. Send an empty array for no TikTok pixels.
          items:
            type: integer
        kwai_client_pixel_ids:
          type: array
          description: >
            Scalev record IDs for SnackVideo browser pixels to attach to this
            page display. Send an empty array for no SnackVideo browser pixels.
          items:
            type: integer
        kwai_server_pixel_ids:
          type: array
          description: >
            Scalev record IDs for SnackVideo Events API pixels to attach to
            this page display. Send an empty array for no SnackVideo server
            pixels.
          items:
            type: integer
        onload_fb_events:
          type: array
          description:
            Meta/Facebook events fired automatically when the page loads.
          items:
            type: string
        onload_tiktok_events:
          type: array
          description: TikTok events fired automatically when the page loads.
          items:
            type: string
        onload_kwai_client_events:
          type: array
          description:
            SnackVideo browser events fired automatically when the page loads.
          items:
            type: string
        onload_kwai_server_events:
          type: array
          description:
            SnackVideo server events fired automatically when the page loads.
          items:
            type: string
        fb_events_onload_parameters:
          type: object
          additionalProperties: true
        tiktok_events_onload_parameters:
          type: object
          additionalProperties: true
        kwai_client_events_onload_parameters:
          type: object
          additionalProperties: true
        kwai_server_events_onload_parameters:
          type: object
          additionalProperties: true
    LandingPageFormDisplayRequest:
      type: object
      additionalProperties: true
      properties:
        store_id:
          type: integer
          description: >
            Required for HTML Checkout pages. After a page has a saved
            `store_id`, new displays for that page must use the same
            `form_display.store_id`; a different store or missing store context
            is rejected.
        variant_ids:
          type: array
          items:
            type: integer
          description:
            Selected product variants. HTML Checkout requires at least one
            `variant_id` or `bundle_price_option_id`.
        bundle_price_option_ids:
          type: array
          items:
            type: integer
          description:
            Selected bundle price options. HTML Checkout requires at least one
            `variant_id` or `bundle_price_option_id`.
        after_submit_event:
          type: string
          enum:
            - success_page
            - direct_to_whatsapp
            - direct_to_custom_whatsapp
            - other_page
            - custom_url
            - is_sending_email_invoice
            - order_page
        handler_assignment:
          type: string
          enum:
            - rotator
            - fixed
          description:
            Required for `direct_to_whatsapp`. When fixed, send
            `store_sales_person_id`.
        store_sales_person_id:
          type: integer
          nullable: true
        custom_phone:
          type: string
          description: Required for `direct_to_custom_whatsapp`.
        other_page_id:
          type: integer
          nullable: true
          description: Required for `other_page`.
        custom_url:
          type: string
          description: Required for `custom_url`.
        onsubmit_fb_events:
          type: array
          description:
            Meta/Facebook events fired after HTML Checkout order creation
            succeeds.
          items:
            type: string
        onsubmit_tiktok_events:
          type: array
          description:
            TikTok events fired after HTML Checkout order creation succeeds.
          items:
            type: string
        onsubmit_kwai_client_events:
          type: array
          description:
            SnackVideo browser events fired after HTML Checkout order creation
            succeeds.
          items:
            type: string
        onsubmit_kwai_server_events:
          type: array
          description:
            SnackVideo server events fired after HTML Checkout order creation
            succeeds.
          items:
            type: string
        fb_events_onsubmit_parameters:
          type: object
          additionalProperties: true
        tiktok_events_onsubmit_parameters:
          type: object
          additionalProperties: true
        kwai_client_events_onsubmit_parameters:
          type: object
          additionalProperties: true
        kwai_server_events_onsubmit_parameters:
          type: object
          additionalProperties: true

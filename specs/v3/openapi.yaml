        Starts a customer password reset. Storefront API reset email links use
        `http(s)://<allowed-storefront-host>/reset-password?token=<reset-token>`.
        Browser calls should rely on the registered `Origin` header for
        reset-link hostname selection; the API falls back to the hosted
        storefront custom domain when `Origin` is not present.
      required:
        - email
      properties:
        email:
          type: string
          format: email
      additionalProperties: true

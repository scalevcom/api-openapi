  /v3/stores/{store_id}/public/auth/login:
    post:
      tags:
        - Customer Auth
      operationId: loginCustomer
      summary: Start customer login
      description: >
        Public storefront endpoint. If the store can complete login directly,
        a successful credential check returns customer JWT tokens. If the store
        requires OTP, a successful credential check sends the one-time code and
        returns a message object so the frontend can show the OTP entry step.
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/StorefrontPublicApiKey"
      requestBody:
        $ref: "#/components/requestBodies/CustomerLoginRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/CustomerLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
  /v3/stores/{store_id}/public/auth/otp/verify:
    post:
      tags:
        - Customer Auth
      operationId: verifyCustomerOtp
      summary: Verify a customer login OTP
      description: "Public storefront endpoint. A successful OTP verification returns customer JWT tokens."
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/StorefrontPublicApiKey"
      requestBody:
        $ref: "#/components/requestBodies/CustomerOtpVerifyRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/CustomerAuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
  /v3/stores/{store_id}/public/auth/jwt/refresh:
    post:
      tags:
        - Customer Auth
      operationId: refreshCustomerJwt
      summary: Refresh a customer JWT
      description: >
        Public storefront endpoint. Refreshes a customer JWT issued by
        storefront customer auth. Refresh tokens are single-use and rotate on
        every successful refresh; store the returned `refresh` value and
        discard the previous one. Reusing an already-rotated refresh token
        revokes the refresh-token family.
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/StorefrontPublicApiKey"
      requestBody:
        $ref: "#/components/requestBodies/JwtRefreshRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/CustomerAuthTokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
  /v3/stores/{store_id}/public/auth/jwt/blacklist:
    post:
      tags:
        - Customer Auth
      operationId: blacklistCustomerJwt
      summary: Blacklist customer JWTs
      description: >
        Public storefront endpoint. Revokes the supplied customer tokens. When
        a tracked refresh token is supplied, the refresh-token family is
        revoked so later refresh attempts fail.
      parameters:
        - $ref: "#/components/parameters/StoreId"
